<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS - Sintercan</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../LOGO MINIMALISTA.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (Para Exportar para Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #090d16; color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-screen flex flex-col bg-slate-950 text-slate-100 overflow-hidden">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md flex-shrink-0">
        <div class="max-w-[1700px] mx-auto px-4 py-2 flex justify-between items-center gap-4">
            <!-- Esquerda: Voltar + Logo + Título -->
            <div class="flex items-center gap-4">
                <button onclick="goBack()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition border border-slate-700 flex items-center justify-center cursor-pointer" title="Voltar ao Menu">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center justify-center p-1 bg-slate-950/80 rounded-xl border border-slate-800 shadow-inner">
                    <img src="../logo.png" alt="Logo" class="h-8 max-h-9 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden p-2 bg-amber-500 rounded-xl text-slate-950 font-bold items-center justify-center">
                        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide text-white leading-tight">Sintercan</h1>
                    <p class="text-[11px] text-amber-400 font-semibold uppercase tracking-wider">Dashboard RS</p>
                </div>
            </div>

            <!-- Direita: Ações (Excel + Power BI) -->
            <div class="flex items-center gap-2">
                <button id="btnExport" onclick="exportToExcel()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/10 cursor-pointer">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    <span>Exportar Excel</span>
                </button>
                <button id="btnTogglePbi" onclick="toggleView()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/10 cursor-pointer">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span id="btnToggleText">Acessar Power BI</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ÁREA DE FILTROS -->
    <section id="filterSection" class="bg-slate-900/90 border-b border-slate-800 p-3 flex-shrink-0">
        <div class="max-w-[1700px] mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 text-xs">
            
            <!-- 1. Pesquisa Geral -->
            <div>
                <label class="block text-slate-400 font-medium mb-1">Pesquisa Geral</label>
                <div class="relative">
                    <input type="text" id="filterGlobal" oninput="debouncedApplyFilters()" placeholder="Buscar em tudo..." class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500">
                    <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-2 text-slate-500"></i>
                </div>
            </div>

            <!-- 2. Cliente (Dropdown Suspenso) -->
            <div class="relative">
                <label class="block text-slate-400 font-medium mb-1">Cliente</label>
                <input type="text" id="filterClienteInput" onfocus="openClienteDropdown()" oninput="filterClienteList()" placeholder="Selecione ou busque..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500">
                
                <div id="clienteDropdown" class="hidden absolute top-full left-0 w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg max-h-48 overflow-y-auto z-50 shadow-2xl">
                    <div onclick="selectCliente('')" class="p-2 hover:bg-slate-800 cursor-pointer text-amber-400 border-b border-slate-800">-- Todos os Clientes --</div>
                    <div id="clienteListOptions"></div>
                </div>
            </div>

            <!-- 3. Ano/Mês -->
            <div>
                <label class="block text-slate-400 font-medium mb-1">Ano / Mês</label>
                <select id="filterAnoMes" onchange="applyFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500">
                    <option value="">Todos</option>
                </select>
            </div>

            <!-- 4. Período -->
            <div class="col-span-1 sm:col-span-2 grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-400 font-medium mb-1">Data De</label>
                    <input type="date" id="filterDataDe" onchange="applyFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-slate-400 font-medium mb-1">Data Até</label>
                    <input type="date" id="filterDataAte" onchange="applyFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
            </div>

        </div>
    </section>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 w-full h-full overflow-hidden relative bg-slate-950">
        
        <!-- DASHBOARD TABELA HTML -->
        <div id="htmlView" class="h-full w-full flex flex-col p-3 overflow-hidden">
            <div class="flex-1 border border-slate-800 rounded-xl bg-slate-900/50 overflow-auto shadow-2xl relative">
                <table id="mainTable" class="w-full text-left text-xs whitespace-nowrap border-collapse">
                    <thead class="bg-slate-900 text-slate-300 sticky top-0 z-10 border-b border-slate-800 font-semibold">
                        <tr>
                            <th class="p-2 border-r border-slate-800/60">Orçamento</th>
                            <th class="p-2 border-r border-slate-800/60">OS</th>
                            <th class="p-2 border-r border-slate-800/60">Cliente</th>
                            <th class="p-2 border-r border-slate-800/60">Código</th>
                            <th class="p-2 border-r border-slate-800/60">N. Pedido</th>
                            <th class="p-2 border-r border-slate-800/60">Item</th>
                            <th class="p-2 border-r border-slate-800/60">SC</th>
                            <th class="p-2 border-r border-slate-800/60 min-w-[250px]">Descrição</th>
                            <th class="p-2 text-right border-r border-slate-800/60">Qtde.</th>
                            <th class="p-2 text-center border-r border-slate-800/60">Aprovação</th>
                            <th class="p-2 text-center border-r border-slate-800/60">Prazo</th>
                            <th class="p-2 text-right border-r border-slate-800/60">Vl. unitário</th>
                            <th class="p-2 text-right">Vl. Total</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/40 text-slate-300 font-mono text-[11px]">
                        <tr>
                            <td colspan="13" class="p-8 text-center text-slate-400 font-sans">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- RODAPÉ DE TOTAIS -->
            <div class="bg-slate-900 border border-slate-800 mt-2 p-2.5 rounded-xl flex justify-between items-center text-xs font-bold text-slate-200 flex-shrink-0">
                <span>Registros Exibidos: <span id="totalLinhas" class="text-amber-400">0</span></span>
                <div class="flex gap-6">
                    <span>Quantidade Total: <span id="totalQtde" class="text-amber-400">0</span></span>
                    <span>Valor Total: <span id="totalValor" class="text-emerald-400">R$ 0,00</span></span>
                </div>
            </div>
        </div>

        <!-- POWER BI -->
        <div id="pbiView" class="h-full w-full hidden">
            <div id="pbiContainer" class="w-full h-full"></div>
        </div>

    </main>

    <!-- ABAS -->
    <nav class="bg-slate-900 border-t border-slate-800 px-2 py-1.5 flex gap-1.5 overflow-x-auto text-xs font-medium flex-shrink-0">
        <button class="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold whitespace-nowrap">RS</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Gráfico</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Mensal</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Mensal por cliente</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Classificação de vendas</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Pedidos em aberto</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Notas Fiscais</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Pedidos em carteira</button>
        <button class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition whitespace-nowrap">Valores por prazo de entrega</button>
    </nav>

    <script>
        // 1. VOLTAR
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../';
            }
        }

        // 2. SEGURANÇA
        const sessionData = localStorage.getItem('sintercan_user');
        if (sessionData) {
            try {
                const currentUser = JSON.parse(sessionData);
                if (Number(currentUser.u_rs) !== 1) {
                    alert("Acesso negado para este módulo.");
                    window.location.href = '../';
                }
            } catch (e) {}
        }

        // 3. POWER BI vs HTML
        let isPbiOpen = false;
        const PBI_URL = "https://app.powerbi.com/view?r=eyJrIjoiZGVhNmFkYTMtYjZiZS00MDA5LTkwZTUtYjQwZjEzYTRlNTlkIiwidCI6ImQ2OWIzZmE3LTBhMGEtNDhhZC1hNDZmLWVhYmM5YzFiMDRjOCJ9";

        function toggleView() {
            isPbiOpen = !isPbiOpen;
            document.getElementById('htmlView').classList.toggle('hidden', isPbiOpen);
            document.getElementById('filterSection').classList.toggle('hidden', isPbiOpen);
            document.getElementById('btnExport').classList.toggle('hidden', isPbiOpen);
            document.getElementById('pbiView').classList.toggle('hidden', !isPbiOpen);
            
            document.getElementById('btnToggleText').textContent = isPbiOpen ? "Voltar ao Dashboard" : "Acessar Power BI";

            const pbiContainer = document.getElementById('pbiContainer');
            if (isPbiOpen && !pbiContainer.innerHTML.trim()) {
                pbiContainer.innerHTML = `<iframe title="RS Power BI" class="w-full h-full border-0" src="${PBI_URL}" allowFullScreen="true"></iframe>`;
            }
        }

        // 4. GESTÃO DE DADOS OTIMIZADA
        let fullData = [];
        let filteredData = [];
        let allClientes = [];
        let filterTimeout = null;

        async function loadRsData() {
            const endpoint = 'https://sintercan.consultoriarf.net/rs';
            try {
                let response = await fetch(endpoint).catch(() => null);
                if (!response || !response.ok) {
                    response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(endpoint)}`);
                }
                if (!response.ok) throw new Error('Falha ao conectar no endpoint');

                fullData = await response.json();
                filteredData = fullData;

                setupClienteDropdown();
                setupAnoMesOptions();
                renderTable(filteredData);
            } catch (err) {
                console.error(err);
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="13" class="p-8 text-center text-rose-400 font-sans">Erro ao carregar os dados do servidor.</td></tr>
                `;
            }
        }

        function formatCurrency(val) {
            const num = parseFloat(val) || 0;
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function parseDate(str) {
            if (!str) return null;
            if (typeof str === 'string' && str.includes('/')) {
                const p = str.split('/');
                let yr = parseInt(p[2], 10);
                if (yr < 100) yr += 2000;
                return new Date(yr, p[1] - 1, p[0]);
            }
            return new Date(str);
        }

        // RENDERIZAÇÃO ALTA PERFORMANCE COM DOCUMENTFRAGMENT
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="13" class="p-8 text-center text-slate-500 font-sans">Nenhum registro encontrado.</td></tr>`;
                document.getElementById('totalLinhas').textContent = '0';
                document.getElementById('totalQtde').textContent = '0';
                document.getElementById('totalValor').textContent = 'R$ 0,00';
                return;
            }

            const fragment = document.createDocumentFragment();
            let totalQtde = 0;
            let totalValor = 0;

            // Renderiza no máximo 1000 linhas pra evitar travar o navegador se houver milhares de itens
            const limit = Math.min(data.length, 1000);

            for (let idx = 0; idx < limit; idx++) {
                const row = data[idx];
                const qtde = parseFloat(row.qtde || row.Qtde || 0);
                const vlTotal = parseFloat(row.vl_total || row.VlTotal || row['VI. Total'] || row['Vl. Total'] || 0);
                const vlUnit = parseFloat(row.vl_unitario || row.VlUnitario || row['VI. unitário'] || row['Vl. unitário'] || 0);

                totalQtde += qtde;
                totalValor += vlTotal;

                const tr = document.createElement('tr');
                tr.className = (idx % 2 === 0 ? 'bg-slate-900/30' : 'bg-slate-950/40') + ' hover:bg-slate-800/50 transition';

                tr.innerHTML = `
                    <td class="p-2 border-r border-slate-800/60">${row.orcamento || row.Orcamento || ''}</td>
                    <td class="p-2 border-r border-slate-800/60">${row.os || row.OS || ''}</td>
                    <td class="p-2 border-r border-slate-800/60 font-sans font-medium text-slate-200">${row.cliente || row.Cliente || ''}</td>
                    <td class="p-2 border-r border-slate-800/60">${row.codigo || row.Codigo || ''}</td>
                    <td class="p-2 border-r border-slate-800/60">${row.n_pedido || row.NPedido || row['N. Pedido'] || ''}</td>
                    <td class="p-2 border-r border-slate-800/60">${row.item || row.Item || ''}</td>
                    <td class="p-2 border-r border-slate-800/60">${row.sc || row.SC || ''}</td>
                    <td class="p-2 border-r border-slate-800/60 font-sans text-slate-300">${row.descricao || row.Descricao || ''}</td>
                    <td class="p-2 text-right border-r border-slate-800/60 font-bold">${qtde}</td>
                    <td class="p-2 text-center border-r border-slate-800/60">${row.aprovacao || row.Aprovacao || ''}</td>
                    <td class="p-2 text-center border-r border-slate-800/60">${row.prazo || row.Prazo || ''}</td>
                    <td class="p-2 text-right border-r border-slate-800/60">${formatCurrency(vlUnit)}</td>
                    <td class="p-2 text-right font-bold text-emerald-400">${formatCurrency(vlTotal)}</td>
                `;
                fragment.appendChild(tr);
            }

            tbody.appendChild(fragment);

            document.getElementById('totalLinhas').textContent = data.length;
            document.getElementById('totalQtde').textContent = totalQtde.toLocaleString('pt-BR');
            document.getElementById('totalValor').textContent = formatCurrency(totalValor);
        }

        // DEBOUNCE
        function debouncedApplyFilters() {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(() => {
                applyFilters();
            }, 250);
        }

        function applyFilters() {
            const globalVal = document.getElementById('filterGlobal').value.toLowerCase();
            const clienteVal = document.getElementById('filterClienteInput').value.toLowerCase();
            const anoMesVal = document.getElementById('filterAnoMes').value;
            const dataDeVal = document.getElementById('filterDataDe').value;
            const dataAteVal = document.getElementById('filterDataAte').value;

            const dateDe = dataDeVal ? new Date(dataDeVal + 'T00:00:00') : null;
            const dateAte = dataAteVal ? new Date(dataAteVal + 'T23:59:59') : null;

            filteredData = fullData.filter(item => {
                if (globalVal) {
                    const str = Object.values(item).join(' ').toLowerCase();
                    if (!str.includes(globalVal)) return false;
                }

                const cliente = (item.cliente || item.Cliente || '').toLowerCase();
                if (clienteVal && !cliente.includes(clienteVal)) return false;

                const d = parseDate(item.aprovacao || item.Aprovacao || item.prazo || item.Prazo);

                if (anoMesVal && d && !isNaN(d)) {
                    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    if (ym !== anoMesVal) return false;
                }

                if (dateDe && d && d < dateDe) return false;
                if (dateAte && d && d > dateAte) return false;

                return true;
            });

            renderTable(filteredData);
        }

        // DROPDOWN CLIENTE
        function setupClienteDropdown() {
            allClientes = [...new Set(fullData.map(i => i.cliente || i.Cliente))].filter(Boolean).sort();
            renderClienteOptions(allClientes);

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('clienteDropdown');
                const input = document.getElementById('filterClienteInput');
                if (dropdown && !dropdown.contains(e.target) && e.target !== input) {
                    dropdown.classList.add('hidden');
                }
            });
        }

        function openClienteDropdown() {
            document.getElementById('clienteDropdown').classList.remove('hidden');
        }

        function filterClienteList() {
            const term = document.getElementById('filterClienteInput').value.toLowerCase();
            const filtered = allClientes.filter(c => c.toLowerCase().includes(term));
            renderClienteOptions(filtered);
            debouncedApplyFilters();
        }

        function renderClienteOptions(list) {
            const container = document.getElementById('clienteListOptions');
            container.innerHTML = '';
            list.slice(0, 100).forEach(c => {
                const div = document.createElement('div');
                div.className = 'p-2 hover:bg-slate-800 cursor-pointer text-slate-300 font-sans';
                div.textContent = c;
                div.onclick = () => selectCliente(c);
                container.appendChild(div);
            });
        }

        function selectCliente(val) {
            document.getElementById('filterClienteInput').value = val;
            document.getElementById('clienteDropdown').classList.add('hidden');
            applyFilters();
        }

        // MÊS / ANO
        function setupAnoMesOptions() {
            const setAnosMeses = new Set();
            fullData.forEach(item => {
                const d = parseDate(item.aprovacao || item.Aprovacao || item.prazo || item.Prazo);
                if (d && !isNaN(d)) {
                    setAnosMeses.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            });

            const select = document.getElementById('filterAnoMes');
            Array.from(setAnosMeses).sort().reverse().forEach(ym => {
                const [y, m] = ym.split('-');
                select.innerHTML += `<option value="${ym}">${m}/${y}</option>`;
            });
        }

        // EXPORTAR EXCEL
        function exportToExcel() {
            if (!filteredData || filteredData.length === 0) {
                alert("Sem dados para exportar.");
                return;
            }

            const exportData = filteredData.map(item => ({
                "Orçamento": item.orcamento || item.Orcamento || '',
                "OS": item.os || item.OS || '',
                "Cliente": item.cliente || item.Cliente || '',
                "Código": item.codigo || item.Codigo || '',
                "N. Pedido": item.n_pedido || item.NPedido || item['N. Pedido'] || '',
                "Item": item.item || item.Item || '',
                "SC": item.sc || item.SC || '',
                "Descrição": item.descricao || item.Descricao || '',
                "Qtde": parseFloat(item.qtde || item.Qtde || 0),
                "Aprovação": item.aprovacao || item.Aprovacao || '',
                "Prazo": item.prazo || item.Prazo || '',
                "Vl. Unitário": parseFloat(item.vl_unitario || item.VlUnitario || 0),
                "Vl. Total": parseFloat(item.vl_total || item.VlTotal || 0)
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "RS");
            XLSX.writeFile(workbook, `Relatorio_RS_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        // INICIALIZAÇÃO
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            loadRsData();
        });
    </script>
</body>
</html>
