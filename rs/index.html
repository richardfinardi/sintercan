<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS - Sintercan</title>
    <link rel="icon" type="image/png" href="../LOGO MINIMALISTA.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        .dark ::-webkit-scrollbar-track { background: #0f172a; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        th { user-select: none; }
        .col-filter-popover { display: none; }
        .col-filter-popover.active { display: block; }
    </style>
</head>
<body class="h-screen flex flex-col bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 overflow-hidden transition-colors duration-200">

    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 shadow-md flex-shrink-0">
        <div class="w-full px-4 py-2 flex justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <button onclick="goBack()" class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl transition border border-slate-300 dark:border-slate-700 flex items-center justify-center cursor-pointer" title="Voltar ao Menu">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                
                <div class="flex items-center justify-center p-1 bg-slate-950 rounded-xl border border-slate-800 shadow-inner">
                    <img src="../logo.png" alt="Logo" class="h-8 max-h-9 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden p-2 bg-amber-500 rounded-xl text-slate-950 font-bold items-center justify-center">
                        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    </div>
                </div>

                <div>
                    <h1 class="text-base font-extrabold tracking-wide text-slate-900 dark:text-white leading-tight">Sintercan</h1>
                    <p id="headerSubtitle" class="text-[11px] text-amber-600 dark:text-amber-400 font-semibold uppercase tracking-wider">Dashboard RS</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="resetAllFilters()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold rounded-lg transition text-xs flex items-center gap-1.5 border border-slate-300 dark:border-slate-700 cursor-pointer">
                    <i data-lucide="filter-x" class="w-4 h-4 text-amber-500 dark:text-amber-400"></i>
                    <span>Limpar Filtros</span>
                </button>
                <button id="btnExport" onclick="exportToExcel()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/10 cursor-pointer">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    <span id="btnExportText">Exportar Excel</span>
                </button>
                <button id="btnTogglePbi" onclick="togglePowerBiView()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/10 cursor-pointer">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span id="btnToggleText">Acessar Power BI</span>
                </button>
            </div>
        </div>
    </header>

    <section id="filterSection" class="bg-slate-50 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 p-2.5 flex-shrink-0">
        <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2.5 text-xs">
            <div>
                <label class="block text-slate-600 dark:text-slate-400 font-medium mb-1">Pesquisa Geral</label>
                <div class="relative">
                    <input type="text" id="filterGlobal" oninput="debouncedApplyFilters()" placeholder="Buscar em tudo..." class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg pl-8 pr-2 py-1 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-amber-500">
                    <i data-lucide="search" class="w-4 h-4 absolute left-2 top-1.5 text-slate-400 dark:text-slate-500"></i>
                </div>
            </div>

            <div class="relative">
                <label class="block text-slate-600 dark:text-slate-400 font-medium mb-1">Cliente</label>
                <input type="text" id="filterClienteInput" onfocus="openClienteDropdown()" oninput="filterClienteList()" placeholder="Selecione ou busque..." class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-amber-500">
                <div id="clienteDropdown" class="hidden absolute top-full left-0 w-full mt-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg max-h-48 overflow-y-auto z-50 shadow-2xl">
                    <div onclick="selectCliente('')" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer text-amber-600 dark:text-amber-400 border-b border-slate-200 dark:border-slate-800">-- Todos os Clientes --</div>
                    <div id="clienteListOptions"></div>
                </div>
            </div>

            <div class="relative">
                <label class="block text-slate-600 dark:text-slate-400 font-medium mb-1">Ano / Mês</label>
                <button onclick="toggleAnoMesTree()" id="btnAnoMesLabel" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-left text-slate-800 dark:text-slate-200 focus:outline-none focus:border-amber-500 flex justify-between items-center cursor-pointer">
                    <span id="anoMesSelectedText" class="truncate">Ano Atual</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                </button>
                <div id="anoMesTreeContainer" class="hidden absolute top-full left-0 w-full mt-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg max-h-60 overflow-y-auto z-50 shadow-2xl p-2 font-sans">
                    <div id="treeContent" class="space-y-1"></div>
                </div>
            </div>

            <div class="col-span-1 sm:col-span-2 grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-600 dark:text-slate-400 font-medium mb-1">Data De</label>
                    <input type="date" id="filterDataDe" onchange="applyFilters()" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-slate-600 dark:text-slate-400 font-medium mb-1">Data Até</label>
                    <input type="date" id="filterDataAte" onchange="applyFilters()" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
            </div>
        </div>
    </section>

    <main class="flex-1 w-full h-full overflow-hidden relative bg-slate-100 dark:bg-slate-950 p-2">
        
        <div id="viewTabRS" class="h-full w-full flex flex-col overflow-hidden">
            <div class="flex-1 border border-slate-300 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900/50 overflow-y-auto overflow-x-hidden shadow-2xl relative">
                <table id="mainTable" class="w-full text-left text-[11px] border-collapse table-fixed">
                    <thead class="bg-slate-200 dark:bg-slate-900 text-slate-700 dark:text-slate-300 sticky top-0 z-20 border-b border-slate-300 dark:border-slate-800 font-semibold">
                        <tr>
                            <th class="w-[5.5%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('n_orcamento')">
                                    <span class="truncate">Orçamento <span id="sort_n_orcamento"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('n_orcamento')" id="btn_filter_n_orcamento" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_n_orcamento" class="col-filter-popover absolute left-0 top-full mt-1 w-52 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[4.5%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('n_os')">
                                    <span class="truncate">OS <span id="sort_n_os"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('n_os')" id="btn_filter_n_os" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_n_os" class="col-filter-popover absolute left-0 top-full mt-1 w-48 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[15%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('cliente')">
                                    <span class="truncate">Cliente <span id="sort_cliente"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('cliente')" id="btn_filter_cliente" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_cliente" class="col-filter-popover absolute left-0 top-full mt-1 w-64 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[8.5%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('cod_mat_no_cliente')">
                                    <span class="truncate" title="Cód. Cliente/Nº Des.">Cód. Cliente/Nº Des. <span id="sort_cod_mat_no_cliente"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('cod_mat_no_cliente')" id="btn_filter_cod_mat_no_cliente" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_cod_mat_no_cliente" class="col-filter-popover absolute left-0 top-full mt-1 w-56 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[6.5%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('pedido_cliente')">
                                    <span class="truncate">N. Pedido <span id="sort_pedido_cliente"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('pedido_cliente')" id="btn_filter_pedido_cliente" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_pedido_cliente" class="col-filter-popover absolute left-0 top-full mt-1 w-52 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[4%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('item')">
                                    <span class="truncate">Item <span id="sort_item"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('item')" id="btn_filter_item" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_item" class="col-filter-popover absolute left-0 top-full mt-1 w-44 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[5.5%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('cod_interno')">
                                    <span class="truncate">SC <span id="sort_cod_interno"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('cod_interno')" id="btn_filter_cod_interno" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_cod_interno" class="col-filter-popover absolute left-0 top-full mt-1 w-48 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[18.5%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 relative group">
                                <div class="flex items-center justify-between cursor-pointer" onclick="sortTable('descricao')">
                                    <span class="truncate">Descrição <span id="sort_descricao"></span></span>
                                    <button onclick="event.stopPropagation(); toggleColumnFilter('descricao')" id="btn_filter_descricao" class="text-slate-400 hover:text-amber-500 dark:text-slate-500 dark:hover:text-amber-400 p-0.5 rounded transition"><i data-lucide="filter" class="w-3 h-3"></i></button>
                                </div>
                                <div id="filter_popover_descricao" class="col-filter-popover absolute left-0 top-full mt-1 w-64 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2 shadow-2xl z-30 font-normal"></div>
                            </th>

                            <th class="w-[4%] p-1.5 border-r border-slate-300 dark:border-slate-800/60 text-right relative group">
                                <div class="flex items-center justify-end gap-1 cursor-pointer" onclick="sortTable('qtde')">
                                    <span class="truncate">Qtde. <span id="sort_qtde"></span></span>
                                    <button
