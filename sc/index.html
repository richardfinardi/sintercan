<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sintercan - Estoque de Produto Acabado</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../LOGO MINIMALISTA.png" />

  <!-- Tailwind CSS e Configuração Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  
  <!-- Script para carregar o tema dinâmico salvo na index -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark .custom-scroll::-webkit-scrollbar-track { background: #070d1e; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #e2e8f0; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    table { border-collapse: separate; border-spacing: 0; width: 100%; }
    th { border-bottom: 2px solid #f59e0b; font-weight: 700; font-size: 10px; text-transform: uppercase; padding: 10px 8px; text-align: left; user-select: none; }
    td { font-size: 11px; padding: 8px; white-space: nowrap; }

    .tab-active {
      background-color: #f59e0b !important;
      color: #070d1e !important;
      border-color: #f59e0b !important;
      font-weight: 800 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col custom-scroll bg-slate-100 dark:bg-[#070d1e] text-slate-800 dark:text-slate-100 transition-colors duration-200">

  <!-- HEADER -->
  <header class="bg-white dark:bg-[#0b1329] border-b border-slate-200 dark:border-[#1e293b] sticky top-0 z-50 shadow-md">
    <div class="max-w-[1700px] mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-4">
      
      <div class="flex items-center gap-4">
        <a href="../" class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl transition border border-slate-300 dark:border-slate-700 flex items-center justify-center" title="Voltar ao Menu">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <!-- CONTAINER DA LOGO EM FUNDO ESCURO FIXO -->
        <div class="flex items-center justify-center p-1 bg-slate-950 rounded-xl border border-slate-800 shadow-inner">
            <img src="../logo.png" alt="Consultoria RF" class="h-10 w-auto object-contain" />
        </div>
        <div class="h-8 w-[1px] bg-slate-300 dark:bg-slate-800 hidden sm:block"></div>
        <div>
          <h1 class="text-sm font-black tracking-wider text-slate-900 dark:text-white uppercase leading-tight">Sintercan</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium leading-tight">Estoque de Produto Acabado</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="btnRefresh" onclick="fetchAllData()" class="flex items-center gap-2 px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-bold text-xs transition shadow-lg shadow-amber-500/10">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="refreshIcon"></i>
          Atualizar Dados
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1700px] w-full mx-auto p-4 flex flex-col gap-4 flex-1">

    <!-- KPIS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-200 dark:border-[#1e293b] shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-500 dark:text-slate-400 text-[10px] font-bold uppercase tracking-wider">TOTAL DE ITENS (FILTRADO)</p>
          <h3 id="kpiTotalItens" class="text-2xl font-black text-slate-900 dark:text-white mt-1">0</h3>
        </div>
        <div class="p-3 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded-xl border border-blue-500/20"><i data-lucide="boxes" class="w-5 h-5"></i></div>
      </div>

      <div class="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-200 dark:border-[#1e293b] shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-500 dark:text-slate-400 text-[10px] font-bold uppercase tracking-wider">QUANTIDADE SOLICITADA</p>
          <h3 id="kpiQtdSolicitada" class="text-2xl font-black text-amber-600 dark:text-amber-400 mt-1">0</h3>
        </div>
        <div class="p-3 bg-amber-500/10 text-amber-600 dark:text-amber-400 rounded-xl border border-amber-500/20"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
      </div>

      <div class="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-200 dark:border-[#1e293b] shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-500 dark:text-slate-400 text-[10px] font-bold uppercase tracking-wider">QUANTIDADE DISPONÍVEL</p>
          <h3 id="kpiQtdDisponivel" class="text-2xl font-black text-emerald-600 dark:text-emerald-400 mt-1">0</h3>
        </div>
        <div class="p-3 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-xl border border-emerald-500/20"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
      </div>

      <div class="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-200 dark:border-[#1e293b] shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-500 dark:text-slate-400 text-[10px] font-bold uppercase tracking-wider">EM PRODUÇÃO</p>
          <h3 id="kpiQtdProduzindo" class="text-2xl font-black text-indigo-600 dark:text-indigo-400 mt-1">0</h3>
        </div>
        <div class="p-3 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-xl border border-indigo-500/20"><i data-lucide="factory" class="w-5 h-5"></i></div>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="bg-white dark:bg-[#0f172a] p-3 rounded-2xl border border-slate-200 dark:border-[#1e293b] flex flex-wrap items-center gap-3 shadow-md">
      <div class="flex items-center gap-2 flex-1 min-w-[240px] bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2">
        <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="render()" placeholder="Pesquisar qualquer coisa (OS, Pedido, SC, Título, Cliente...)" 
               class="w-full text-xs bg-transparent text-slate-800 dark:text-white focus:outline-none placeholder-slate-400 dark:placeholder-slate-500">
      </div>

      <div id="wrapperFilterOs" class="flex items-center gap-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 min-w-[160px]">
        <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i>
        <select id="filterOs" onchange="render()" class="w-full text-xs bg-transparent text-slate-800 dark:text-white focus:outline-none cursor-pointer">
          <option value="" class="bg-white dark:bg-slate-900">OS Destino (Todas)</option>
        </select>
      </div>

      <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 min-w-[160px]">
        <i data-lucide="tag" class="w-4 h-4 text-slate-400"></i>
        <select id="filterProduto" onchange="render()" class="w-full text-xs bg-transparent text-slate-800 dark:text-white focus:outline-none cursor-pointer">
          <option value="" class="bg-white dark:bg-slate-900">Cód. Produto (Todos)</option>
        </select>
      </div>

      <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 min-w-[160px]">
        <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
        <select id="filterCliente" onchange="render()" class="w-full text-xs bg-transparent text-slate-800 dark:text-white focus:outline-none cursor-pointer">
          <option value="" class="bg-white dark:bg-slate-900">Todos os Clientes</option>
        </select>
      </div>

      <button onclick="clearFilters()" class="flex items-center gap-2 px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30 rounded-xl font-bold text-xs transition">
        <i data-lucide="filter-x" class="w-4 h-4"></i>
        Limpar
      </button>
    </div>

    <!-- ABAS -->
    <div class="flex border-b border-slate-200 dark:border-[#1e293b] gap-2 overflow-x-auto custom-scroll pt-1">
      <button id="tab-estoque" onclick="switchTab('estoque')" class="tab-btn px-4 py-2 text-xs font-bold rounded-t-xl border-b-2 border-amber-500 bg-white dark:bg-[#0f172a] text-amber-600 dark:text-amber-400 flex items-center gap-2 whitespace-nowrap tab-active">
        <i data-lucide="box" class="w-4 h-4"></i>
        EM ESTOQUE
      </button>

      <button id="tab-orcamento" onclick="switchTab('orcamento')" class="tab-btn px-4 py-2 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        EM ESTOQUE PARA ORÇAMENTO
      </button>

      <button id="tab-produzindo" onclick="switchTab('produzindo')" class="tab-btn px-4 py-2 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="hammer" class="w-4 h-4"></i>
        PRODUZINDO
      </button>

      <button id="tab-entregues" onclick="switchTab('entregues')" class="tab-btn px-4 py-2 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="check-check" class="w-4 h-4"></i>
        ENTREGUES
      </button>

      <button id="tab-parciais" onclick="switchTab('parciais')" class="tab-btn px-4 py-2 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="pie-chart" class="w-4 h-4"></i>
        PARCIAIS
      </button>
    </div>

    <!-- TABELA -->
    <div class="bg-white dark:bg-[#0f172a] rounded-2xl border border-slate-200 dark:border-[#1e293b] overflow-hidden shadow-md flex-1 flex flex-col">
      <div class="overflow-x-auto custom-scroll flex-1">
        <table>
          <thead class="sticky top-0 z-10 bg-slate-100 dark:bg-[#070d1e]">
            <tr id="tableHeader"></tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200 dark:divide-[#1e293b]"></tbody>
        </table>
      </div>

      <div class="bg-slate-50 dark:bg-slate-950 p-3 border-t border-slate-200 dark:border-[#1e293b] flex justify-between items-center text-xs font-bold text-slate-700 dark:text-slate-300">
        <span>REGISTROS ENCONTRADOS: <strong id="totalCount" class="text-amber-600 dark:text-amber-400">0</strong></span>
        <div id="footerSums" class="flex gap-4 font-mono"></div>
      </div>
    </div>

  </main>

  <script>
    // VALIDAÇÃO DE SESSÃO E PERMISSÃO DE ACESSO
    const sessionData = localStorage.getItem('sintercan_user');
    if (!sessionData) {
        window.location.href = '../';
    }

    const currentUser = JSON.parse(sessionData);
    if (Number(currentUser.u_estoque_pa) !== 1) {
        alert("Acesso negado para este módulo.");
        window.location.href = '../';
    }

    const API_ESTOQUE = 'https://sintercan.consultoriarf.net/estoque_sc';
    const API_ORCAMENTO = 'https://sintercan.consultoriarf.net/estoque_sc_orc';

    let rawDataEstoque = [];
    let rawDataOrcamento = [];
    let currentTab = 'estoque';

    let sortColumn = 'cod_os_completo';
    let sortDirection = 'asc';

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = String(d.getFullYear()).slice(-2);
      return `${day}/${month}/${year}`;
    }

    const tabConfigs = {
      estoque: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'Disponivel', key: 'qtde_disponivel', align: 'right', sum: true },
          { label: 'n_orcamento', key: 'n_orcamento', align: 'right' },
          { label: 'cliente', key: 'cliente' }
        ],
        source: () => rawDataEstoque,
        filter: item => Number(item.qtde_disponivel) > 0,
        defaultSort: 'cod_os_completo'
      },
      orcamento: {
        cols: [
          { label: 'Orçamento', key: 'n_orcamento' },
          { label: 'Cliente', key: 'cliente' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Item', key: 'nome' },
          { label: 'Qtde. Reservada', key: 'qtde_reservada', align: 'right', sum: true },
          { label: 'Pre. de entrega', key: 'dt_previsao_entrega', formatter: formatDate },
          { label: 'dt_aprovacao', key: 'dt_aprovacao', formatter: formatDate }
        ],
        source: () => rawDataOrcamento,
        filter: item => true,
        defaultSort: 'dt_previsao_entrega'
      },
      produzindo: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'Qtde', key: 'qtde_produzindo', align: 'right', sum: true },
          { label: 'n_orcamento', key: 'n_orcamento', align: 'right' },
          { label: 'cliente', key: 'cliente' }
        ],
        source: () => rawDataEstoque,
        filter: item => Number(item.qtde_produzindo) > 0,
        defaultSort: 'cod_os_completo'
      },
      entregues: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'n_orcamento', key: 'n_orcamento' },
          { label: 'cliente', key: 'cliente' }
        ],
        source: () => rawDataEstoque,
        filter: item => item.entregue && String(item.entregue).toLowerCase().includes('total'),
        defaultSort: 'cod_os_completo'
      },
      parciais: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'Situação', key: 'entregue' },
          { label: 'Solicitado', key: 'qtde_solicitada', align: 'right', sum: true },
          { label: 'Entregue', key: 'qtde_entregue', align: 'right', sum: true },
          { label: 'Disponivel', key: 'qtde_disponivel', align: 'right', sum: true },
          { label: 'Produzindo', key: 'qtde_produzindo', align: 'right', sum: true },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'Orçamento', key: 'n_orcamento' },
          { label: 'cliente', key: 'cliente' }
        ],
        source: () => rawDataEstoque,
        filter: item => item.entregue && String(item.entregue).toLowerCase().includes('parcial'),
        defaultSort: 'cod_os_completo'
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchAllData();
    });

    async function fetchAllData() {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin');

      try {
        const [resEstoque, resOrcamento] = await Promise.all([
          fetch(`${API_ESTOQUE}?_t=${Date.now()}`),
          fetch(`${API_ORCAMENTO}?_t=${Date.now()}`)
        ]);

        rawDataEstoque = await resEstoque.json();
        rawDataOrcamento = await resOrcamento.json();

        populateDropdowns();
        render();
      } catch (err) {
        console.error("Erro ao carregar dados:", err);
      } finally {
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    function populateDropdowns() {
      const combined = [...rawDataEstoque, ...rawDataOrcamento];

      const fill = (id, key) => {
        const el = document.getElementById(id);
        const vals = [...new Set(combined.map(i => i[key]).filter(Boolean))].sort();
        const firstOpt = el.options[0].text;
        el.innerHTML = `<option value="" class="bg-white dark:bg-slate-900">${firstOpt}</option>`;
        vals.forEach(v => el.innerHTML += `<option value="${v}" class="bg-white dark:bg-slate-900">${v}</option>`);
      };

      fill('filterOs', 'n_os');
      fill('filterProduto', 'codigo_interno');
      fill('filterCliente', 'cliente');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('tab-active');
        b.classList.add('text-slate-500', 'dark:text-slate-400', 'border-transparent');
      });

      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('tab-active');

      const wrapperOs = document.getElementById('wrapperFilterOs');
      if (tab === 'orcamento') {
        wrapperOs.classList.add('hidden');
      } else {
        wrapperOs.classList.remove('hidden');
      }

      sortColumn = tabConfigs[tab].defaultSort;
      sortDirection = 'asc';

      render();
    }

    function handleSort(key) {
      if (sortColumn === key) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = key;
        sortDirection = 'asc';
      }
      render();
    }

    function render() {
      const config = tabConfigs[currentTab];
      const sourceData = config.source();
      let filtered = sourceData.filter(config.filter);

      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const osVal = document.getElementById('filterOs').value;
      const prodVal = document.getElementById('filterProduto').value;
      const cliVal = document.getElementById('filterCliente').value;

      if (search) {
        filtered = filtered.filter(i => 
          (i.n_os && String(i.n_os).toLowerCase().includes(search)) ||
          (i.cod_os_completo && String(i.cod_os_completo).toLowerCase().includes(search)) ||
          (i.codigo_interno && String(i.codigo_interno).toLowerCase().includes(search)) ||
          (i.nome && String(i.nome).toLowerCase().includes(search)) ||
          (i.titulo && String(i.titulo).toLowerCase().includes(search)) ||
          (i.cliente && String(i.cliente).toLowerCase().includes(search)) ||
          (i.n_orcamento && String(i.n_orcamento).toLowerCase().includes(search))
        );
      }

      if (osVal && currentTab !== 'orcamento') filtered = filtered.filter(i => String(i.n_os) === osVal);
      if (prodVal) filtered = filtered.filter(i => i.codigo_interno === prodVal);
      if (cliVal) filtered = filtered.filter(i => i.cliente === cliVal);

      filtered.sort((a, b) => {
        let valA = a[sortColumn] ?? '';
        let valB = b[sortColumn] ?? '';

        if (typeof valA === 'number' && typeof valB === 'number') {
          return sortDirection === 'asc' ? valA - valB : valB - valA;
        }

        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();

        if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
        if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
        return 0;
      });

      document.getElementById('kpiTotalItens').textContent = filtered.length;
      document.getElementById('kpiQtdSolicitada').textContent = filtered.reduce((a, b) => a + (Number(b.qtde_solicitada) || 0), 0);
      document.getElementById('kpiQtdDisponivel').textContent = filtered.reduce((a, b) => a + (Number(b.qtde_disponivel) || 0), 0);
      document.getElementById('kpiQtdProduzindo').textContent = filtered.reduce((a, b) => a + (Number(b.qtde_produzindo) || 0), 0);
      document.getElementById('totalCount').textContent = filtered.length;

      document.getElementById('tableHeader').innerHTML = config.cols.map(c => {
        const isSorted = sortColumn === c.key;
        const icon = isSorted ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '';
        const activeClass = isSorted ? 'text-amber-600 dark:text-amber-400 font-black' : 'text-slate-500 dark:text-slate-400';

        return `
          <th onclick="handleSort('${c.key}')" class="cursor-pointer ${c.align === 'right' ? 'text-right' : 'text-left'} ${activeClass}">
            ${c.label}<span class="text-amber-600 dark:text-amber-400">${icon}</span>
          </th>
        `;
      }).join('');

      document.getElementById('tableBody').innerHTML = filtered.map((row, index) => `
        <tr class="${index % 2 === 0 ? 'bg-slate-50/50 dark:bg-[#0b1329]' : 'bg-white dark:bg-[#0f172a]'} hover:bg-slate-100 dark:hover:bg-[#1e293b] transition">
          ${config.cols.map(c => {
            let val = row[c.key] !== null && row[c.key] !== undefined ? row[c.key] : '';
            if (c.formatter) val = c.formatter(val);

            return `
              <td class="${c.align === 'right' ? 'text-right font-mono text-amber-600 dark:text-amber-400' : 'text-left text-slate-700 dark:text-slate-200'}">
                ${val}
              </td>
            `;
          }).join('')}
        </tr>
      `).join('');

      const sumsContainer = document.getElementById('footerSums');
      sumsContainer.innerHTML = '';
      config.cols.filter(c => c.sum).forEach(c => {
        const total = filtered.reduce((acc, curr) => acc + (Number(curr[c.key]) || 0), 0);
        sumsContainer.innerHTML += `<span>TOTAL ${c.label.toUpperCase()}: <strong class="text-amber-600 dark:text-amber-400">${total}</strong></span>`;
      });

      lucide.createIcons();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterOs').value = '';
      document.getElementById('filterProduto').value = '';
      document.getElementById('filterCliente').value = '';
      sortColumn = tabConfigs[currentTab].defaultSort;
      sortDirection = 'asc';
      render();
    }
  </script>
</body>
</html>
