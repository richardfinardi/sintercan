    function formatDate(dateStr) {
      if (!dateStr) return '';

      if (isNaN(d.getTime())) return dateStr;
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = String(d.getFullYear()).slice(-2);
      return `${day}/${month}/${year}`;
    }

function loadRetiradas(){
  try {
    const salvo = JSON.parse(localStorage.getItem(RETIRADAS_STORAGE_KEY) || '{}');
    return salvo && typeof salvo === 'object' && !Array.isArray(salvo) ? salvo : {};
  } catch (err) {
    console.warn('Não foi possível ler as retiradas locais.', err);
    return {};
  }
}

function loadRetiradasAntigas() {
  try {
    const dados = JSON.parse(localStorage.getItem(RETIRADAS_LEGACY_KEY) || '{}');
    return dados && typeof dados === 'object' && !Array.isArray(dados) ? dados : {};
  } catch (err) {
    return {};
  }
}

function persistirRetiradas(){
  try {
    localStorage.setItem(RETIRADAS_STORAGE_KEY, JSON.stringify(retiradas));
    return true;
  } catch (err) {
    console.error('Não foi possível salvar a retirada neste navegador.', err);
    alert('Não foi possível salvar a retirada neste navegador. Verifique se o armazenamento local está habilitado.');
    return false;
  }
}

function idRetirada(item) {
  return item._idRetirada || '';
}

// TORCAMENTO_ITENS.GUID_LINHA identifica individualmente a linha do orçamento.
function atribuirIdsRetirada(linhas) {
  const ocorrencias = new Map();
  const valor = (row, campo) => {
    const chave = Object.keys(row).find(k => k.toLowerCase() === campo.toLowerCase());
    return chave && row[chave] != null ? String(row[chave]).trim() : '';
  };
  const idsDeLinha = [
    'guid_linha', 'guid_orcamento_item', 'guid_item_orcamento',
    'cod_orcamento_item', 'cod_orcamento_itens', 'cod_item_orcamento',
    'id_item_orcamento', 'codigo_item_orcamento', 'codigo_torcamento_itens',
    'id_item', 'codigo_item', 'n_item', 'n_pedido_item'
  ];
  for (const item of linhas) {
    const empresa = valor(item, 'cod_empresa');
    const orcamento = valor(item, 'cod_orcamento') || valor(item, 'n_orcamento');
    const identificador = idsDeLinha.map(c => [c, valor(item, c)]).find(([,v]) => v !== '');
    let base;
    if (identificador) {
      base = JSON.stringify(['linha', empresa, orcamento, identificador[0], identificador[1]]);
    } else {
      // Sem GUID da linha, diferencia por data, descrição e quantidade.
      base = JSON.stringify(['detalhes', empresa, orcamento,
        valor(item, 'cod_produto'), valor(item, 'codigo_interno'),
        valor(item, 'nome'), valor(item, 'descricao'), valor(item, 'item'),
        valor(item, 'dt_previsao_entrega'), valor(item, 'dt_aprovacao'),
        valor(item, 'qtde_reservada'), valor(item, 'qtde')
      ]);
    }
    // Garante independência mesmo para registros completamente idênticos.
    const numero = (ocorrencias.get(base) || 0) + 1;
    ocorrencias.set(base, numero);
    item._idRetirada = base + '#' + numero;
  }
  return linhas;
}

function numeroCampo(item, nomes){
  for (const nome of nomes) {
    if (item[nome] !== undefined && item[nome] !== null && String(item[nome]).trim() !== '') {
      const n = Number(String(item[nome]).replace(',', '.'));
      if (Number.isFinite(n)) return n;
    }
  }
  return NaN;
}

function orcamentoJaFaturado(item){
  const total = numeroCampo(item, ['qtde', 'quantidade', 'qtde_item']);
  const faturada = numeroCampo(item, ['qtde_faturada', 'quantidade_faturada']);
  if (total > 0 && Number.isFinite(faturada) && faturada >= total) return true;
  const saldo = numeroCampo(item, ['saldo_a_faturar', 'qtde_pendente_faturar']);
  if (Number.isFinite(saldo) && saldo <= 0 && (total > 0 || faturada > 0)) return true;
  if (item.faturado === true || item.faturado === 1 || String(item.faturado).toLowerCase() === 'sim') return true;
  return ['FATURADO', 'TOTALMENTE FATURADO'].includes(String(item.situacao_faturamento || item.status_faturamento || '').trim().toUpperCase());
}

function statusCompartilhamentoSc(online) {
  const badge = document.getElementById('retiradaSyncBadge');
  const bola = document.getElementById('retiradaSyncDot');
  const texto = document.getElementById('retiradaSyncText');
  if (!badge || !bola || !texto) return;
  badge.className = 'inline-flex items-center gap-2 rounded-lg border px-3 py-2 text-[11px] font-bold whitespace-nowrap ' +
    (online ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300' :
      'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-700 text-rose-700 dark:text-rose-300');
  bola.className = 'w-2 h-2 rounded-full ' + (online ? 'bg-emerald-500' : 'bg-rose-500');
  texto.textContent = online ? 'RETIRADAS ONLINE' : 'RETIRADAS OFFLINE';
  badge.title = online ? 'Retiradas sincronizadas com os outros funcionários.' :
    'Sem acesso ao armazenamento compartilhado. Marcações bloqueadas para evitar dados inconsistentes.';
}

async function migrarRetiradasLocaisAntigas(estadoRemoto) {
  if (!dadosCarregadosSc || localStorage.getItem(MARCACAO_MIGRADA)) return;
  const antigas = loadRetiradasAntigas();
  // Importa marcações antigas somente na primeira ativação, se o servidor
  // estiver vazio. Nunca sobrescreve o trabalho de outro funcionário.
  if (Object.keys(estadoRemoto).length === 0) {
    const idsValidos = new Set(rawDataOrcamento.filter(i => !orcamentoJaFaturado(i)).map(idRetirada));
    for (const [id, registro] of Object.entries(antigas)) {
      if (!registro || !idsValidos.has(id)) continue;
      const res = await fetch(API_RETIRADAS, {
        method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
        body: JSON.stringify({id,retirado:true,usuario:registro.usuario || currentUser.nome || ''})
      });
      if (!res.ok) throw new Error('Falha ao migrar retiradas salvas neste navegador.');
    }
  }
  localStorage.setItem(MARCACAO_MIGRADA, new Date().toISOString());
}

async function sincronizarRetiradas() {
  if (sincronizandoRetiradas || salvandoRetirada) return;
  sincronizandoRetiradas = true;
  const versaoAntes = versaoRetiradas;
  try {
    let resposta = await fetch(API_RETIRADAS, {cache:'no-store'});
    if (!resposta.ok) throw new Error('Servidor de retiradas: HTTP ' + resposta.status);
    let dados = await resposta.json();
    if (!dados.retiradas || typeof dados.retiradas !== 'object' || Array.isArray(dados.retiradas))
      throw new Error('Retiradas: resposta inválida');

    if (dadosCarregadosSc && !localStorage.getItem(MARCACAO_MIGRADA)) {
      await migrarRetiradasLocaisAntigas(dados.retiradas);
      // Releia após migrar, sem ignorar estado publicado por outro usuário.
      resposta = await fetch(API_RETIRADAS, {cache:'no-store'});
      if (!resposta.ok) throw new Error('Falha ao reler retiradas após migração.');
      dados = await resposta.json();
      if (!dados.retiradas || typeof dados.retiradas !== 'object' || Array.isArray(dados.retiradas))
        throw new Error('Retiradas: resposta inválida após migração.');
    }

    if (salvandoRetirada || versaoAntes !== versaoRetiradas) return;
    retiradas = dados.retiradas;
    retiradasSincronizadas = true;
    persistirRetiradas(); // Cache opcional; API é a única fonte oficial.
    statusCompartilhamentoSc(true);
    render();
  } catch (err) {
    console.warn('Retiradas compartilhadas indisponíveis:',err);
    retiradasSincronizadas = false;
    statusCompartilhamentoSc(false);
    render();
  } finally {
    sincronizandoRetiradas = false;
  }
}

async function toggleRetirada(checkbox) {
  if (!retiradasSincronizadas || salvandoRetirada) {
    checkbox.checked = !checkbox.checked;
    alert('As retiradas não estão sincronizadas. Aguarde a conexão com a API.');
    return;
  }
  const id = decodeURIComponent(checkbox.dataset.retiradaId || '');
  if (!id) return;
  const marcado = checkbox.checked;
  checkbox.disabled = true;
  salvandoRetirada = true;
  versaoRetiradas++;
  try {
    const resposta = await fetch(API_RETIRADAS, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      cache:'no-store',
      body:JSON.stringify({id,retirado:marcado,usuario:currentUser.nome || ''})
    });
    if (!resposta.ok) throw new Error('Não foi possível salvar: HTTP ' + resposta.status);
    const resultado = await resposta.json();
    if (resultado.ok !== true || resultado.id !== id || resultado.retirado !== marcado)
      throw new Error('O servidor não confirmou a gravação.');
    if (marcado) retiradas[id] = resultado.registro || {usuario:currentUser.nome || ''};
    else delete retiradas[id];
    persistirRetiradas();
    statusCompartilhamentoSc(true);
  } catch (err) {
    console.error('Falha ao registrar retirada:',err);
    retiradasSincronizadas = false;
    statusCompartilhamentoSc(false);
    alert('Não foi possível salvar a retirada no servidor. Nenhuma marcação foi confirmada.');
  } finally {
    salvandoRetirada = false;
    render();
    sincronizarRetiradas();
  }
}

function renderRetiradaCell(row){
  const id = idRetirada(row);
  const checked = Boolean(retiradas[id]);
  return `<td class="text-center">
    <label class="inline-flex items-center gap-2 cursor-pointer" title="${checked ? 'Desmarcar retirada' : 'Marcar como retirado'}">
      <input type="checkbox" data-retirada-id="${encodeURIComponent(id)}" onchange="toggleRetirada(this)"
        class="w-4 h-4 accent-emerald-600 cursor-pointer" ${checked ? 'checked' : ''} ${!retiradasSincronizadas || salvandoRetirada ? 'disabled' : ''}
        aria-label="Retirado do estoque para o orçamento ${row.n_orcamento || ''}">
      <span class="text-[10px] font-bold ${checked ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-500'}">${checked ? 'RETIRADO' : 'PENDENTE'}</span>
    </label>
  </td>`;
}

function getRowClass(row,index){
  if (currentTab === 'orcamento' && retiradas[idRetirada(row)]) {
    return 'bg-emerald-50 dark:bg-emerald-950/30';
  }
  return index % 2 === 0 ? 'bg-slate-50/50 dark:bg-[#0b1329]' : 'bg-white dark:bg-[#0f172a]';
}

    document.addEventListener('DOMContentLoaded', iniciarSc);

    // Cache-first como no RS: carrega imediatamente o último conjunto local,
    // busca dados novos sem bloquear o usuário e salva a versão da API.
    function abrirBancoCacheSc() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB indisponível'));
        const req = indexedDB.open('SINTERCAN_SC_CACHE', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('dados')) db.createObjectStore('dados', { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Erro ao abrir cache SC'));
      });
    }

    async function lerCacheSc() {
      const db = await abrirBancoCacheSc();
      try {
        return await new Promise((resolve, reject) => {
          const req = db.transaction('dados', 'readonly').objectStore('dados').get('estoque_orc_v1');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error || new Error('Erro ao ler cache SC'));
        });
      } finally {
        db.close();
      }
    }

    async function gravarCacheSc(estoque, orcamento, savedAt) {
      const db = await abrirBancoCacheSc();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('dados', 'readwrite');
          tx.objectStore('dados').put({key:'estoque_orc_v1',estoque,orcamento,savedAt});
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error('Erro ao salvar cache SC'));
          tx.onabort = () => reject(tx.error || new Error('Gravação cache SC cancelada'));
        });
      } finally {
        db.close();
      }
    }

    function horaSc(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? '' : d.toLocaleString('pt-BR', {
        day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'
      });
    }

    function statusDadosSc(tipo, savedAt = null) {
      const badge = document.getElementById('dataStatusBadge');
      const label = document.getElementById('dataStatusText');
      const dot = document.getElementById('dataStatusDot');
      if (!badge || !label || !dot) return;
      const configs = {
        api: ['bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300','bg-emerald-500','API'],
        cache: ['bg-sky-50 dark:bg-sky-950/40 border-sky-200 dark:border-sky-700 text-sky-700 dark:text-sky-300','bg-sky-500','CACHE LOCAL'],
        updating: ['bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-700 text-amber-700 dark:text-amber-300','bg-amber-500 animate-pulse','SINCRONIZANDO...'],
        error: ['bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-700 text-rose-700 dark:text-rose-300','bg-rose-500','SEM DADOS']
      };
      const [classes, bola, texto] = configs[tipo] || configs.updating;
      badge.className = 'inline-flex items-center gap-2 rounded-lg border px-3 py-2 text-[11px] font-bold whitespace-nowrap ' + classes;
      dot.className = 'w-2 h-2 rounded-full shrink-0 ' + bola;
      label.textContent = texto + ((tipo === 'api' || tipo === 'cache') && savedAt ? ' • ' + horaSc(savedAt) : '');
      badge.title = tipo === 'cache' ? 'Exibindo dados salvos neste computador; aguardando a API.' :
        tipo === 'api' ? 'Dados atualizados pela API e armazenados no cache.' :
        tipo === 'updating' ? 'Atualizando em segundo plano sem bloquear a tabela.' :
        'API indisponível e sem cache local.';
    }

    function aplicarDadosSc(estoque, orcamento) {
      if (!Array.isArray(estoque) || !Array.isArray(orcamento)) throw new Error('Dados inválidos.');
      rawDataEstoque = estoque.map(item => ({
        ...item, localizacao_estoque: item.localizacao_estoque ?? item.LOCALIZACAO_ESTOQUE ?? ''
      }));
      rawDataOrcamento = atribuirIdsRetirada(orcamento.map(item => ({
        ...item, localizacao_estoque: item.localizacao_estoque ?? item.LOCALIZACAO_ESTOQUE ?? ''
      })));
      dadosCarregadosSc = true;
      populateDropdowns();
      render();
    }

    async function iniciarSc() {
      lucide.createIcons();
      statusDadosSc('updating');
      try {
        const cache = await lerCacheSc();
        if (cache && Array.isArray(cache.estoque) && Array.isArray(cache.orcamento)) {
          aplicarDadosSc(cache.estoque, cache.orcamento);
          cacheSalvoEmSc = cache.savedAt || null;
          statusDadosSc('cache', cacheSalvoEmSc);
        }
      } catch(err) {
        console.warn('Cache SC não pôde ser lido:', err);
      }
      // A tela é liberada pelo cache, enquanto dados e retiradas atualizam.
      fetchAllData(false);
      sincronizarRetiradas();
      setInterval(() => {
        if (document.visibilityState !== 'visible') return;
        if (!atualizandoSc && Date.now() - ultimaSincronizacaoSc >= SC_REFRESH_MS) fetchAllData(false);
      }, 30000);
      setInterval(() => {
        if (document.visibilityState === 'visible') sincronizarRetiradas();
      }, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        sincronizarRetiradas();
        if (Date.now() - ultimaSincronizacaoSc >= SC_REFRESH_MS) fetchAllData(false);
      });
    }

    async function fetchAllData(manual = false) {
      if (atualizandoSc) return;
      atualizandoSc = true;
      const icon = document.getElementById('refreshIcon');
      const botao = document.getElementById('btnRefresh');
      icon?.classList.add('animate-spin');
      if (botao) botao.disabled = true;
      statusDadosSc('updating', cacheSalvoEmSc);

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 45000);
      try {
        const [resEstoque, resOrcamento] = await Promise.all([
          fetch(API_ESTOQUE, {cache:'no-store',signal:controller.signal}),
          fetch(API_ORCAMENTO, {cache:'no-store',signal:controller.signal})
        ]);
        if (!resEstoque.ok || !resOrcamento.ok) throw new Error('Falha ao consultar os endpoints de estoque.');
        const [dadosEstoque, dadosOrcamento] = await Promise.all([resEstoque.json(),resOrcamento.json()]);
        if (!Array.isArray(dadosEstoque) || !Array.isArray(dadosOrcamento)) throw new Error('Resposta inválida da API.');

        aplicarDadosSc(dadosEstoque, dadosOrcamento);
        cacheSalvoEmSc = new Date().toISOString();
        ultimaSincronizacaoSc = Date.now();
        statusDadosSc('api', cacheSalvoEmSc);
        try {
          await gravarCacheSc(dadosEstoque,dadosOrcamento,cacheSalvoEmSc);
        } catch(err) {
          console.warn('Não foi possível gravar o cache SC:',err);
        }
        if (manual) console.info('SC: API e cache local atualizados.');
      } catch (err) {
        console.error('Falha na atualização SC:',err);
        statusDadosSc(dadosCarregadosSc ? 'cache' : 'error', cacheSalvoEmSc);
        if (manual) alert(dadosCarregadosSc ?
          'API indisponível. Mantendo os dados anteriores na tela.' :
          'Falha ao carregar os dados. Não há cache disponível.');
      } finally {
        clearTimeout(timer);
        atualizandoSc = false;
        icon?.classList.remove('animate-spin');
        if (botao) botao.disabled = false;
      }
    }

    function populateDropdowns() {
      const combined = [...rawDataEstoque, ...rawDataOrcamento];

      const fill = (id, key) => {
        const el = document.getElementById(id);
        const selecionado = el.value;
        const vals = [...new Set(combined.map(i => i[key]).filter(Boolean))].sort();
        const firstOpt = el.options[0].text;
        el.innerHTML = `<option value="" class="bg-white dark:bg-slate-900">${firstOpt}</option>`;
        vals.forEach(v => el.innerHTML += `<option value="${v}" class="bg-white dark:bg-slate-900">${v}</option>`);
        if (vals.some(v => String(v) === String(selecionado))) el.value = selecionado;
      };

      fill('filterOs', 'n_os');
      fill('filterProduto', 'codigo_interno');
      fill('filterCliente', 'cliente');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('tab-active');
        b.classList.add('text-slate-500', 'dark:text-slate-400', 'border-transparent');
      });

      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('tab-active');

      const wrapperOs = document.getElementById('wrapperFilterOs');
      if (tab === 'orcamento') {
        wrapperOs.classList.add('hidden');
      } else {
        wrapperOs.classList.remove('hidden');
      }
      document.getElementById('wrapperFilterRetirada').classList.toggle('hidden', tab !== 'orcamento');

      sortColumn = tabConfigs[tab].defaultSort;
      sortDirection = 'asc';

      render();
    }

    function handleSort(key) {
      if (sortColumn === key) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = key;
        sortDirection = 'asc';
      }
      render();
    }

    function render() {
      const config = tabConfigs[currentTab];
      const sourceData = config.source();
      let filtered = sourceData.filter(config.filter);
      if (currentTab === 'orcamento') {
        const retirada = document.getElementById('filterRetirada').value;
        if (retirada === 'pendentes') filtered = filtered.filter(i => !retiradas[idRetirada(i)]);
        if (retirada === 'retirados') filtered = filtered.filter(i => Boolean(retiradas[idRetirada(i)]));
      }

      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const osVal = document.getElementById('filterOs').value;
      const prodVal = document.getElementById('filterProduto').value;
      const cliVal = document.getElementById('filterCliente').value;

      if (search) {
        filtered = filtered.filter(i => 
          (i.n_os && String(i.n_os).toLowerCase().includes(search)) ||
          (i.cod_os_completo && String(i.cod_os_completo).toLowerCase().includes(search)) ||
          (i.codigo_interno && String(i.codigo_interno).toLowerCase().includes(search)) ||
          (i.nome && String(i.nome).toLowerCase().includes(search)) ||
          (i.titulo && String(i.titulo).toLowerCase().includes(search)) ||
          (i.cliente && String(i.cliente).toLowerCase().includes(search)) ||
          (i.localizacao_estoque && String(i.localizacao_estoque).toLowerCase().includes(search)) ||
          (i.n_orcamento && String(i.n_orcamento).toLowerCase().includes(search))
        );
      }

      if (osVal && currentTab !== 'orcamento') filtered = filtered.filter(i => String(i.n_os) === osVal);
      if (prodVal) filtered = filtered.filter(i => i.codigo_interno === prodVal);
      if (cliVal) filtered = filtered.filter(i => i.cliente === cliVal);

      filtered.sort((a, b) => {
        let valA = a[sortColumn] ?? '';
        let valB = b[sortColumn] ?? '';

        if (typeof valA === 'number' && typeof valB === 'number') {
          return sortDirection === 'asc' ? valA - valB : valB - valA;
        }

        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();

        if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
        if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
        return 0;
      });

      document.getElementById('kpiTotalItens').textContent = filtered.length;
      document.getElementById('kpiQtdSolicitada').textContent = filtered.reduce((a, b) => a + (Number(b.qtde_solicitada) || 0), 0);
      document.getElementById('kpiQtdDisponivel').textContent = filtered.reduce((a, b) => a + (Number(b.qtde_disponivel) || 0), 0);
      document.getElementById('kpiQtdProduzindo').textContent = filtered.reduce((a, b) => a + (Number(b.qtde_produzindo) || 0), 0);
      document.getElementById('totalCount').textContent = filtered.length;

      document.getElementById('tableHeader').innerHTML = config.cols.map(c => {
        if (c.type === 'checkbox') return `<th class="text-center text-slate-500 dark:text-slate-400">${c.label}</th>`;
        const isSorted = sortColumn === c.key;
        const icon = isSorted ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '';
        const activeClass = isSorted ? 'text-amber-600 dark:text-amber-400 font-black' : 'text-slate-500 dark:text-slate-400';

        return `
          <th onclick="handleSort('${c.key}')" class="cursor-pointer ${c.align === 'right' ? 'text-right' : 'text-left'} ${activeClass}">
            ${c.label}<span class="text-amber-600 dark:text-amber-400">${icon}</span>
          </th>
        `;
      }).join('');

      document.getElementById('tableBody').innerHTML = filtered.map((row, index) => `
        <tr class="${getRowClass(row, index)} hover:bg-slate-100 dark:hover:bg-[#1e293b] transition">
          ${config.cols.map(c => {
            if (c.type === 'checkbox') return renderRetiradaCell(row);
            let val = row[c.key] !== null && row[c.key] !== undefined ? row[c.key] : '';
            if (c.formatter) val = c.formatter(val);

            return `
              <td class="${c.align === 'right' ? 'text-right font-mono text-amber-600 dark:text-amber-400' : 'text-left text-slate-700 dark:text-slate-200'}">
                ${val}
              </td>
            `;
          }).join('')}
        </tr>
      `).join('');

      const sumsContainer = document.getElementById('footerSums');
      sumsContainer.innerHTML = '';
      if (currentTab === 'orcamento') {
        const retirados = filtered.filter(i => Boolean(retiradas[idRetirada(i)])).length;
        sumsContainer.innerHTML = `<span>RETIRADOS: <strong class="text-emerald-600 dark:text-emerald-400">${retirados}</strong></span><span>PENDENTES: <strong class="text-amber-600 dark:text-amber-400">${filtered.length - retirados}</strong></span>`;
      }
      config.cols.filter(c => c.sum).forEach(c => {
        const total = filtered.reduce((acc, curr) => acc + (Number(curr[c.key]) || 0), 0);
        sumsContainer.innerHTML += `<span>TOTAL ${c.label.toUpperCase()}: <strong class="text-amber-600 dark:text-amber-400">${total}</strong></span>`;
      });

      lucide.createIcons();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterOs').value = '';
      document.getElementById('filterProduto').value = '';
      document.getElementById('filterCliente').value = '';
      document.getElementById('filterRetirada').value = '';
      sortColumn = tabConfigs[currentTab].defaultSort;
      sortDirection = 'asc';
      render();
    }
  </script>
