name: Financeiro - testes de contrato
on:
  pull_request:
    paths:
      - 'financeiro/**'
      - '.github/workflows/financeiro-tests.yml'
  push:
    paths:
      - 'financeiro/**'
      - '.github/workflows/financeiro-tests.yml'
jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar testes
        run: node --test financeiro/contrato.test.cjs
